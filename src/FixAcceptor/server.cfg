[DEFAULT]
ConnectionType=acceptor
StartTime=00:00:00
EndTime=23:59:59
HeartBtInt=30
FileStorePath=store
FileLogPath=log
UseDataDictionary=Y
DataDictionary=FIX44.xml
ValidateUserDefinedFields=N
AllowUnknownMsgFields=Y
# --- Session policy ---
# Reset sequence numbers on each Logon. Friendly default for a sample server
# so reconnecting clients never hit "MsgSeqNum too low". For a production
# acceptor you usually want all three set to N so sequence numbers persist
# across drops and the ResendRequest flow can recover gaps.
ResetOnLogon=Y
ResetOnLogout=N
ResetOnDisconnect=N
# Reload the store from disk on each Logon (N = keep in-memory state).
RefreshOnLogon=N
# Persist outbound app messages so we can answer ResendRequest from the store.
PersistMessages=Y
# Logon/Logout handshake timeouts (seconds).
LogonTimeout=10
LogoutTimeout=2
# Reject inbound messages whose SendingTime is more than MaxLatency seconds
# from our clock — catches clients with badly skewed time.
CheckLatency=Y
MaxLatency=120
# Allow the acceptor port to be re-bound immediately on restart.
SocketReuseAddress=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=SERVER
TargetCompID=CLIENT
SocketAcceptPort=5001
